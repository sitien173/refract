<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 332" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="refract_data_flow_diagram-title refract_data_flow_diagram-desc" id="refract_data_flow_diagram-root">
      <title id="refract_data_flow_diagram-title">Refract job data flow</title>
      <desc id="refract_data_flow_diagram-desc">The Coordinator submits a job; the daemon resolves a target plan, queues the job, and hands the prompt to a worker CLI; the worker can ask the Coordinator a question; the daemon settles the result and the Coordinator collects it with wait.</desc>
      <defs>
      <style>#refract_data_flow_diagram-root { --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #5a6580; --rule: rgba(45,49,66,0.12); --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #refract_data_flow_diagram-root { color: var(--ink); font-family: var(--sans); }
      #refract_data_flow_diagram-root .diagram-container { width: 100%; overflow-x: auto; }
      #refract_data_flow_diagram-root .step-number, #refract_data_flow_diagram-root .step-label, #refract_data_flow_diagram-root .lane-label, #refract_data_flow_diagram-root .role-text, #refract_data_flow_diagram-root .chip-text, #refract_data_flow_diagram-root .legend-label { font-family: var(--mono); text-anchor: middle; }
      #refract_data_flow_diagram-root .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
      #refract_data_flow_diagram-root .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
      #refract_data_flow_diagram-root .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
      #refract_data_flow_diagram-root .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
      #refract_data_flow_diagram-root .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
      #refract_data_flow_diagram-root .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
      #refract_data_flow_diagram-root .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
      #refract_data_flow_diagram-root .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
      #refract_data_flow_diagram-root .focal-text { fill: var(--accent); }
      #refract_data_flow_diagram-root .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
      #refract_data_flow_diagram-root .legend-text { fill: var(--muted); font: 400 7px var(--sans); }</style>
        <pattern id="refract_data_flow_diagram-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="#2d3142" fill-opacity="0.10"/></pattern>
        <marker id="refract_data_flow_diagram-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="refract_data_flow_diagram-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#bf4520"/></marker>
        <marker id="refract_data_flow_diagram-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="840" height="332" fill="#f5f5f5"/>
      <rect width="840" height="332" fill="url(#refract_data_flow_diagram-dots)"/>
      <rect x="0" y="116" width="840" height="80" fill="#2d3142" fill-opacity="0.018"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="840" y2="36" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
      <line x1="0" y1="116" x2="840" y2="116" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
      <line x1="0" y1="196" x2="840" y2="196" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
      <line x1="0" y1="276" x2="840" y2="276" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
      <g aria-label="Job steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="196" y="17" class="step-number">01</text><text x="196" y="31" class="step-label">SUBMIT</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="308" y="17" class="step-number">02</text><text x="308" y="31" class="step-label">ROUTE</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="420" y="17" class="step-number">03</text><text x="420" y="31" class="step-label">QUEUE</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="#bf4520" fill-opacity="0.20"/><text x="532" y="17" class="step-number focal-text">04</text><text x="532" y="31" class="step-label focal-text">RUN</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="644" y="17" class="step-number">05</text><text x="644" y="31" class="step-label">SETTLE</text>
        <rect x="740" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="756" y="17" class="step-number">06</text><text x="756" y="31" class="step-label">COLLECT</text>
      </g>
      <g aria-label="Role lanes">
        <text x="70" y="72" class="lane-label">COORDINATOR</text><text x="70" y="84" class="lane-label">HOST AGENT</text>
        <text x="70" y="152" class="lane-label">REFRACT</text><text x="70" y="164" class="lane-label">DAEMON</text>
        <text x="70" y="232" class="lane-label">WORKER</text><text x="70" y="244" class="lane-label">CLI</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#4f5d75" marker-end="url(#refract_data_flow_diagram-arr-muted)"/>
      <path d="M358 156 H370" fill="none" stroke="#4f5d75" marker-end="url(#refract_data_flow_diagram-arr-muted)"/>
      <path d="M470 156 H494 Q502 156 502 164 V204" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#refract_data_flow_diagram-arr-accent)"/>
      <path d="M566 204 V108" fill="none" stroke="#4f5d75" stroke-dasharray="4,3" marker-end="url(#refract_data_flow_diagram-arr-muted)"/>
      <path d="M582 236 H636 Q644 236 644 228 V188" fill="none" stroke="#4f5d75" marker-end="url(#refract_data_flow_diagram-arr-muted)"/>
      <path d="M694 156 H748 Q756 156 756 148 V108" fill="none" stroke="#2e5aa8" marker-end="url(#refract_data_flow_diagram-arr-link)"/>
      <rect x="510" y="172" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="181" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>

      <!-- Coordinator: Submit job -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="159" y="55" class="role-text">COO</text>
      <text x="196" y="71" class="node-title">Submit job</text><text x="196" y="84" class="node-sub">workflow · prompt</text><text x="196" y="96" class="node-tool">MCP submit</text>
      <!-- Refract: Resolve plan -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="271" y="135" class="role-text">DAE</text>
      <text x="308" y="151" class="node-title">Resolve plan</text><text x="308" y="164" class="node-sub">profile → targets</text><text x="308" y="176" class="node-tool">fallback · breaker</text>
      <!-- Refract: Queue job -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="383" y="135" class="role-text">DAE</text>
      <text x="420" y="151" class="node-title">Queue job</text><text x="420" y="164" class="node-sub">state: queued</text><text x="420" y="176" class="node-tool">FIFO · 1 per project</text>
      <!-- Coordinator: Answer -->
      <rect x="482" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="486" y="48" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="495" y="55" class="role-text">COO</text>
      <text x="532" y="71" class="node-title">Answer</text><text x="532" y="84" class="node-sub">pending_question</text><text x="532" y="96" class="node-tool">worker resumes</text>
      <!-- Worker: Run worker -->
      <rect x="482" y="204" width="100" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.07"/>
      <rect x="486" y="208" width="18" height="10" rx="3" fill="#bf4520" fill-opacity="0.20"/><text x="495" y="215" class="role-text focal-text">WRK</text>
      <text x="532" y="231" class="node-title">Run worker</text><text x="532" y="244" class="node-sub">argv · prompt · cwd</text><text x="532" y="256" class="node-tool">codex/claude/pi/agy</text>
      <!-- Refract: Settle result -->
      <rect x="594" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="598" y="128" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="607" y="135" class="role-text">DAE</text>
      <text x="644" y="151" class="node-title">Settle result</text><text x="644" y="164" class="node-sub">text · tokens · state</text><text x="644" y="176" class="node-tool">result file + SQLite</text>
      <!-- Coordinator: Wait -->
      <rect x="706" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="710" y="48" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="719" y="55" class="role-text">COO</text>
      <text x="756" y="71" class="node-title">Wait</text><text x="756" y="84" class="node-sub">result · result_path</text><text x="756" y="96" class="node-tool">MCP wait</text>

      <!-- Legend: steps -->
      <text x="164" y="295" class="legend-label">STEPS</text>
      <rect x="180" y="286" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="192" y="294.5" class="step-number">01</text><text x="212" y="295" class="legend-text">Submit</text>
      <rect x="280" y="286" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="292" y="294.5" class="step-number">02</text><text x="312" y="295" class="legend-text">Route</text>
      <rect x="380" y="286" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="392" y="294.5" class="step-number">03</text><text x="412" y="295" class="legend-text">Queue</text>
      <rect x="480" y="286" width="24" height="12" rx="6" fill="#bf4520" fill-opacity="0.20"/><text x="492" y="294.5" class="step-number focal-text">04</text><text x="512" y="295" class="legend-text">Run</text>
      <rect x="580" y="286" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="592" y="294.5" class="step-number">05</text><text x="612" y="295" class="legend-text">Settle</text>
      <rect x="680" y="286" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="692" y="294.5" class="step-number">06</text><text x="712" y="295" class="legend-text">Collect</text>
      <!-- Legend: flow -->
      <text x="164" y="319" class="legend-label">FLOW</text>
      <line x1="180" y1="316" x2="204" y2="316" stroke="#4f5d75" marker-end="url(#refract_data_flow_diagram-arr-muted)"/><text x="212" y="319" class="legend-text">Hand-off</text>
      <line x1="300" y1="316" x2="324" y2="316" stroke="#bf4520" stroke-width="1.2" marker-end="url(#refract_data_flow_diagram-arr-accent)"/><text x="332" y="319" class="legend-text">Focal hand-off</text>
      <line x1="440" y1="316" x2="464" y2="316" stroke="#2e5aa8" marker-end="url(#refract_data_flow_diagram-arr-link)"/><text x="472" y="319" class="legend-text">Result to Coordinator</text>
      <line x1="600" y1="316" x2="624" y2="316" stroke="#4f5d75" stroke-dasharray="4,3" marker-end="url(#refract_data_flow_diagram-arr-muted)"/><text x="632" y="319" class="legend-text">Worker question</text>
    </svg>
