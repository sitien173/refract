<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="refract_system_architecture-title refract_system_architecture-desc" id="refract_system_architecture-root">
        <title id="refract_system_architecture-title">Refract system architecture</title>
        <desc id="refract_system_architecture-desc">The Coordinator host calls the Refract daemon over MCP; the runtime stores jobs in SQLite and queues them through the scheduler and target executor to worker CLIs, which can ask the Coordinator questions through the ask API.</desc>
        <defs>
      <style>#refract_system_architecture-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #refract_system_architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #refract_system_architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#refract_system_architecture-root .diagram-container { overflow-x: visible; }
}</style>
