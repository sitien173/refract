name: tests

on:
  push:
    branches: ["**"]
    paths: ["server/**", "plugin/**", "sonar-project.properties", ".github/workflows/server.yml", ".github/workflows/sonarqube.yml"]
  pull_request:
    paths: ["server/**", "plugin/**", "sonar-project.properties", ".github/workflows/server.yml", ".github/workflows/sonarqube.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web / Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/web/.nvmrc
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run check:bundle

  cross-platform:
    needs: [web]
    defaults:
      run:
        working-directory: server
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --all-extras --frozen
      - name: Python tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest --cov --cov-report=xml
      - name: Python compatibility tests
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: python-coverage
          path: server/coverage.xml
          if-no-files-found: error
      - run: uv build

  sonar:
    needs: [cross-platform]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit
