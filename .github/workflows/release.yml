name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    uses: ./.github/workflows/server.yml

  plugin-tests:
    uses: ./.github/workflows/plugin.yml

  release:
    needs: [server-tests, plugin-tests]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Release must run on a tag, not $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv build
      - name: Extract release notes
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          python3 ../scripts/bump_version.py notes "$version" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --verify-tag
