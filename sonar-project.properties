sonar.projectKey=refract
sonar.projectName=refract
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=server/src,server/web/src,plugin
sonar.exclusions=**/dashboard_static/**,**/node_modules/**,**/__pycache__/**,plugin/tests/**,server/web/src/test/**,**/*.test.js,**/*.test.jsx

sonar.tests=server/tests,server/web/src,plugin/tests
sonar.test.inclusions=server/tests/**,plugin/tests/**,server/web/src/test/**,**/*.test.js,**/*.test.jsx

sonar.python.version=3.12

sonar.python.coverage.reportPaths=server/coverage.xml
sonar.javascript.lcov.reportPaths=server/web/coverage/lcov.info
