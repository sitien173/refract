version: 1
name: triage
inputs:
  prompt:
    type: string
    required: true
  commit_message:
    type: string
stages:
  review:
    mode: read
    route: sentinel
    context: reviewer
    prompt: |
      Inspect this request and list the concrete changes required to satisfy it.
      Be specific about files, functions, and edge cases. Do not implement anything.

      Request:
      ${inputs.prompt}
  fix:
    mode: write
    route: forge
    context: coder
    needs: [review]
    prompt: |
      Implement the following request, incorporating the reviewer's findings.
      When the change is complete and correct, commit it.

      Request:
      ${inputs.prompt}

      Required changes from the reviewer:
      ${stages.review.text}
  verify:
    mode: read
    route: sentinel
    context: reviewer
    needs: [fix]
    prompt: |
      Verify that the implementation correctly addresses the original request and
      the required changes. Report whether the fix is complete and correct, and
      list any remaining gaps.

      Original request:
      ${inputs.prompt}

      Required changes:
      ${stages.review.text}

      Implementation result:
      ${stages.fix.text}
result_stage: verify
