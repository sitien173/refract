version: 1
name: triage
inputs:
  prompt:
    type: string
    required: true
  commit_message:
    type: string
stages:
  review:
    mode: read
    route: sentinel
    context: reviewer
    prompt: |
      Inspect this request and list the required changes.
      Be specific and enumerate each change needed.
      Request: ${inputs.prompt}
  fix:
    mode: write
    route: forge
    context: coder
    needs: [review]
    prompt: |
      Implement the change for this request and commit it.
      Request: ${inputs.prompt}
      Incorporate these review findings:
      ${stages.review.text}
      Commit message: ${inputs.commit_message}
  verify:
    mode: read
    route: sentinel
    context: verifier
    needs: [fix]
    prompt: |
      A change was implemented and committed to address this request:
      ${inputs.prompt}
      Verify the fix at commit ${stages.fix.commit}.
      Confirm the implementation is correct and complete.
result_stage: verify
