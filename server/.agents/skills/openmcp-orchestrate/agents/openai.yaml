interface:
  display_name: "OpenMCP Orchestrate"
  short_description: "Manage and run durable OpenMCP workflows safely"
  default_prompt: "Use $openmcp-orchestrate to check the daemon, reload configuration when needed, and route, run, review, or integrate this project task safely."

dependencies:
  tools:
    - type: "mcp"
      value: "openmcp"
      description: "OpenMCP durable project orchestration server"
      transport: "streamable_http"
      url: "http://127.0.0.1:8765/mcp"
