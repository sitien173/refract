interface:
  display_name: "OpenMCP Orchestrate"
  short_description: "Manage durable OpenMCP jobs safely"
  default_prompt: "Use $openmcp-orchestrate to check the daemon, consult task guidance, select a workflow and profile, run jobs, review results, and integrate approved changes safely."

dependencies:
  tools:
    - type: "mcp"
      value: "openmcp"
      description: "OpenMCP durable project orchestration server"
      transport: "streamable_http"
      url: "http://127.0.0.1:8765/mcp"
