schema_version = 1

[daemon]
host = "127.0.0.1"
port = 8765
max_jobs = 10
default_profile = "base"
breaker_failure_threshold = 3
breaker_base_cooldown_s = 60
breaker_max_cooldown_s = 900
ask_timeout_s = 300

[logging]
level = "INFO"
file = "openmcp.log"
max_bytes = 10485760
backup_count = 5

[notifications]
enabled = true

# ------------------------------- Claude_Code ------------------------------------------

[[targets]]
id = "cc/claude-opus-high"
backend = "claude"
model = "opus"
reasoning = "high"
max_concurrency = 3
env = { REFRACT_DISABLE = "1" }
args = ["--verbose", "--settings", "{\"enabledPlugins\":{\"refract@refract\":false}}"]

[[targets]]
id = "cc/claude-opus-medium"
backend = "claude"
model = "opus"
reasoning = "medium"
max_concurrency = 3
env = { REFRACT_DISABLE = "1" }
