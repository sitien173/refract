# ------------------------------- CODEX ----------------------------------------------

[[targets]]
id = "codex/astra-high"
backend = "codex"
model = "gpt-6-astra"
reasoning = "high"
max_concurrency = 3
backend_profile = "example"
retry = { attempts = 2, codes = ["service_error"], patterns = ["temporarily unavailable"] }
env = { REFRACT_DISABLE = "1", OPENAI_BASE_URL = "https://api.example.invalid/v1" }

