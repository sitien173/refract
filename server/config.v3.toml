[profiles."base"]
implement = ["cc/claude-sonnet-medium", "cc/claude-haiku-high", "agy-gemini-flash-high"]
consult = ["cc/claude-opus-high", "agy-gemini-pro-medium", "codex/sol-high", "codex/astra-medium"]
review = ["codex/sol-medium", "agy-gemini-hydrogen-high", "cc/claude-opus-medium"]
other = ["agy-gemini-flash-high", "codex/luna-high"]

[profiles."balanced"]
extends = "base"
consult = ["agy-gemini-pro-medium", "codex/astra-medium", "cc/claude-opus-medium", "agy-opus"]
implement = ["agy-gemini-hydrogen-high", "codex/luna-high", "cc/claude-sonnet-medium", "agy-gemini-flash-high"]
review = ["codex/terra-high", "cc/claude-opus-medium"]

[profiles."google"]
extends = "base"
consult = ["agy-gemini-pro-medium"]
implement = ["agy-gemini-hydrogen-medium", "agy-gemini-flash-high", "agy-sonnet"]
review = "agy-gemini-hydrogen-high"

[profiles."openai"]
extends = "base"
consult = ["codex/sol-high", "codex/astra-medium"]
implement = { targets = ["codex/luna-high"], timeout_s = 1800 }
review = ["codex/terra-high"]

[profiles."anthropic"]
extends = "base"
consult = ["cc/claude-opus-high"]
implement = ["cc/claude-sonnet-medium", "cc/claude-haiku-high"]
review = ["cc/claude-opus-medium"]
