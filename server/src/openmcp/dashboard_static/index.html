<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenMCP Monitor Console</title>
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('theme');
          if (storedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
          console.warn('Unable to restore theme preference; using light mode.', error);
        }
      })();
    </script>
    <script type="module" crossorigin src="/dashboard/assets/assets/index-CSlrrhcl.js"></script>
    <link rel="stylesheet" crossorigin href="/dashboard/assets/assets/index-DUyfToPt.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
