schema = 1

[pricing]
currency = "USD"

# Prices are USD per 1M tokens, Standard tier, base (shortest-context) tier.
# Model keys are canonical model names: the string a driver reports in job_metrics.model with any
# provider prefix removed (the text after the last "/") and then resolved through
# [pricing.aliases].
# Keys contain no "/". Alias keys are exact, case-sensitive display names and never model keys.

# Anthropic: https://platform.claude.com/docs/en/about-claude/pricing, retrieved 2026-11-11
# cache_write is the 5-minute cache write price. cache_read is 0.05x input for Opus 5.5 and
# Sonnet 5.5, and the listed price for Haiku 5.5. Haiku 5.5 uses the "up to 100,000 tokens"
# tier. The agy driver reports the same models as "Claude Sonnet 5.5" and "Claude Opus 5.5", which
# [pricing.aliases] maps to the keys below.
[pricing.models."claude-opus-5-5"]
input = 4.0
output = 20.0
cache_read = 0.20
cache_write = 5.0

[pricing.models."claude-sonnet-5-5"]
input = 2.0
output = 10.0
cache_read = 0.10
cache_write = 2.50

[pricing.models."claude-haiku-5-5"]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

# OpenAI: https://developers.openai.com/api/docs/pricing, retrieved 2026-11-11
# cache_read is "Cached input". cache_write is the 30m write price. The pi driver reports the
# same models with an "openai-codex/" provider prefix, which canonical naming removes.
[pricing.models."gpt-6-astra"]
input = 10.0
output = 50.0
cache_read = 1.0
cache_write = 12.50

[pricing.models."gpt-6.1-sol"]
input = 2.0
output = 10.0
cache_read = 0.10
cache_write = 2.50

[pricing.models."gpt-6.1-terra"]
input = 1.0
output = 5.0
cache_read = 0.05
cache_write = 1.25

[pricing.models."gpt-6-luna"]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

# Google: https://ai.google.dev/gemini-api/docs/pricing, retrieved 2026-11-11
# Paid tier, Standard. The page lists one price per model for all thinking levels, so the
# "(High)" and "(Medium)" display names alias to one key. These are the promotional prices in
# effect on the retrieval date: Gemini 4 Argon rises to input 4.00, output 20.00, caching 0.20 on
# 2026-12-01, and Gemini 3.8 Flash rises to input 1.50, output 7.50, caching 0.15 on 2027-01-01.
# cache_read is "Context caching price". The page lists no cache write price, so cache_write
# uses the input price.
[pricing.models."Gemini 4 Argon"]
input = 2.0
output = 10.0
cache_read = 0.10
cache_write = 2.0

[pricing.models."Gemini 3.8 Flash"]
input = 0.75
output = 3.75
cache_read = 0.075
cache_write = 0.75

[pricing.aliases]
"Claude Opus 5.5" = "claude-opus-5-5"
"Claude Sonnet 5.5" = "claude-sonnet-5-5"
"Gemini 4 Argon (High)" = "Gemini 4 Argon"
"Gemini 4 Argon (Medium)" = "Gemini 4 Argon"
"Gemini 3.8 Flash (High)" = "Gemini 3.8 Flash"
