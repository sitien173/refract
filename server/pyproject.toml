[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "refract"
version = "3.0.4"
description = "Durable local orchestration for coding-agent CLI backends."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0,<2.1",
    "pydantic>=2",
    "starlette>=1.3.1",
    "uvicorn>=0.49.0",
    "notify-py>=0.3.43,<0.4",
    "coding-agent-cli==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
]
[project.scripts]
refract = "refract.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/refract"]

[tool.uv]
package = true
exclude-newer = "7 days"
# First-party library, exempt from the cooldown so a new release can be pinned on publish.
exclude-newer-package = { coding-agent-cli = false }

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: marks tests that require live backend CLIs",
]

[tool.coverage.run]
source = ["src/refract"]

[tool.coverage.xml]
output = "coverage.xml"
